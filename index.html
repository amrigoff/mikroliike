<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F6F8">
  <title>Mikroliike</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view-today" class="view">
    <!-- Päivämäärä ja tervehdys -->
    <header class="top">
      <p class="date" id="date-line"></p>
      <h1 id="greeting"></h1>
    </header>

    <!-- Askelkortti -->
    <section class="card steps-card">
      <div class="card-head">
        <h2>Askeleet</h2>
        <span class="chip">Viikon tavoite</span>
      </div>
      <button class="ring-button" id="ring-button" aria-label="Muuta viikon askeltavoitetta">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-bg" cx="100" cy="100" r="84"></circle>
          <circle class="ring-fg" id="ring-fg" cx="100" cy="100" r="84"></circle>
          <circle class="ring-over" id="ring-over" cx="100" cy="100" r="84"></circle>
        </svg>
        <span class="ring-text">
          <span class="ring-total" id="ring-total">0</span>
          <span class="ring-goal" id="ring-goal">/ 42 000</span>
        </span>
      </button>
      <p class="steps-avg" id="steps-avg"></p>
      <p class="steps-need" id="steps-need"></p>
      <button class="btn btn-primary btn-wide" id="log-steps-btn">Kirjaa päivän askeleet</button>
    </section>

    <!-- Tänään-kortti -->
    <section class="card">
      <div class="card-head">
        <h2>Tänään</h2>
      </div>
      <p class="hint">Unohtuiko jokin? Paina päivän pistettä.</p>
      <ul class="habits" id="habits"></ul>
    </section>

    <!-- Salitreeni-kortti -->
    <section class="card">
      <div class="card-head">
        <h2>Salitreeni</h2>
        <span class="gym-count" id="gym-count">0 / 2</span>
      </div>
      <div class="gym-bars" id="gym-bars"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="gym-btn">+ Kirjaa</button>
        <button class="btn btn-outline" id="gym-edit-btn">Korjaa</button>
      </div>
    </section>

    <!-- Päivän muistiinpano -->
    <section class="card">
      <div class="card-head">
        <h2>Päivän muistiinpano</h2>
      </div>
      <input class="note-input" id="note-input" type="text" maxlength="80"
             placeholder="esim. hyvä energia, matkapäivä" aria-label="Päivän muistiinpano">
    </section>
  </main>

  <main id="view-history" class="view" hidden>
    <header class="top"><h1>Historia</h1></header>
    <div id="history-list" class="history-list"></div>
  </main>

  <main id="view-settings" class="view" hidden>
    <header class="top"><h1>Asetukset</h1></header>
    <section class="card">
      <div class="card-head"><h2>Varmuuskopio</h2></div>
      <p class="muted settings-text">Tallenna tiedot tiedostoksi esim. Google Driveen. Tiedostosta voit palauttaa ne myöhemmin, vaikka uuteen puhelimeen.</p>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="export-btn">Vie tiedot</button>
        <button class="btn btn-outline" id="import-btn">Tuo tiedot</button>
      </div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <p class="settings-msg" id="settings-msg" role="status"></p>
    </section>
  </main>

  <!-- Alavalikko -->
  <nav class="tabbar">
    <button class="tab active" data-view="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
      Tänään
    </button>
    <button class="tab" data-view="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      Historia
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      Asetukset
    </button>
  </nav>

  <!-- Alhaalta nouseva paneeli (askeltavoite ja askelten kirjaus) -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
